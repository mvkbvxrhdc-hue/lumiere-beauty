services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ent207tc-backend
    environment:
      DATABASE_URL: sqlite:////data/skin_backend.db
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend_latest
      dockerfile: Dockerfile
    container_name: ent207tc-frontend
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
