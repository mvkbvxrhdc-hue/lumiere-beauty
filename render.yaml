services:
  - type: web
    name: lumiere-beauty-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./skin_backend.db
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
